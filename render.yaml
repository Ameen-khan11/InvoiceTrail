services:
  # Backend API Web Service
  - type: web
    name: invoicetrail-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn --workers=2 --bind=0.0.0.0:$PORT --timeout=120 run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: invoicetrail-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_CLIENT_ID
        sync: false

  # Frontend Static Site
  - type: web
    name: invoicetrail-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: invoicetrail-api
          property: host

databases:
  # Managed PostgreSQL Database
  - name: invoicetrail-db
    plan: free
    databaseName: invoicetrail
    user: invoicetrail_user
